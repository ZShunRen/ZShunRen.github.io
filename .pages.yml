media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]

content:
  - name: posts
    label: Posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{primary}.md"
      field: create
    view:
      fields: [title, date, category, ctfName, draft]
      primary: title
      sort: [date, title]
      search: [title, description, tags, ctfName]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: date
        label: Publication date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: tags
        label: Tags
        type: string
        list: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values:
            - name: work
              label: Work
            - name: ctf
              label: CTF
      - name: ctfName
        label: CTF Name
        type: string
        required: false
        description: Event name and year, such as Example CTF 2026. CTF writeups with the same name are grouped together on the blog.
      - name: draft
        label: Draft
        type: boolean
        default: true
      - name: cover
        label: Cover image
        type: image
        required: false
      - name: coverAlt
        label: Cover image alt text
        type: string
        required: false
        description: Describe the cover image for readers who cannot see it.
      - name: body
        label: Body
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true

  - name: profile
    label: Profile
    type: file
    path: src/data/profile.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
        required: true
      - name: description
        label: Site description
        type: text
        required: true
      - name: email
        label: Email
        type: string
        required: true
      - name: github
        label: GitHub URL
        type: string
        required: true
      - name: linkedin
        label: LinkedIn URL
        type: string
        required: true
      - name: about
        label: About
        type: object
        fields:
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
            required: true

      - name: theme
        label: Site theme story
        type: object
        fields:
          - name: title
            label: Heading
            type: string
            required: true
          - name: paragraphs
            label: Paragraphs
            type: text
            list: true
            required: true

  - name: ctf-rankings
    label: CTF Rankings
    type: file
    path: src/data/ctf-rankings.json
    format: json
    fields:
      - name: rankings
        label: Rankings
        type: object
        list: true
        fields:
          - name: event
            label: Event and year
            type: string
            required: true
          - name: category
            label: Category (optional)
            type: string
          - name: placement
            label: Placement
            type: string
            required: true

  - name: projects
    label: Archived projects
    type: file
    path: src/data/projects.json
    format: json
    fields:
      - name: spaceInvaders
        label: Space Invaders Game
        type: object
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: repository
            label: Repository URL
            type: string
            required: true
          - name: paragraphs
            label: Detail paragraphs
            type: text
            list: true
            required: true
      - name: spotifyTimeMachine
        label: Spotify Time Machine Script
        type: object
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
          - name: repository
            label: Repository URL
            type: string
            required: true
          - name: paragraphs
            label: Detail paragraphs
            type: text
            list: true
            required: true
